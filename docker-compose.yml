services:
  sensorscope:
    build: .
    ports:
      - "127.0.0.1:${SS_PORT:-8000}:8000"
    environment:
      SS_DB_PATH: /app/data/sensorscope.sqlite3
      SS_SIMULATOR: ${SS_SIMULATOR:-true}
      SS_INTERVAL: ${SS_INTERVAL:-1}
      SS_THRESHOLD: ${SS_THRESHOLD:-3.5}
      SS_SEED: ${SS_SEED:-2026}
    volumes:
      - sensorscope-data:/app/data
    restart: unless-stopped

volumes:
  sensorscope-data:
